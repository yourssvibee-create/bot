[tool.poetry]
name = "bot1-intent-hijacker"
version = "0.1.0"
description = "Ominvo Bot 1 — intent hijacker"
authors = ["Ominvo <ops@ominvo.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
"psycopg" = {extras = ["binary"], version = "^3.2"}
httpx = "^0.27"
groq = "^0.11"
python-dotenv = "^1.0"
playwright = "^1.47"
pydantic = "^2.8"
"python-telegram-bot" = "^21.5"
beautifulsoup4 = "^4.12"
tenacity = "^9.0"
praw = "^7.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.vercel]
entrypoint = "api.telegram_webhook:handler"
