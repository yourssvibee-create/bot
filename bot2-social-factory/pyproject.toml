[tool.poetry]
name = "bot2-social-factory"
version = "0.1.0"
description = "Ominvo Bot 2 — social-factory"
authors = ["Ominvo <ops@ominvo.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
"psycopg" = {extras = ["binary"], version = "^3.2"}
httpx = "^0.27"
groq = "^0.11"
python-dotenv = "^1.0"
playwright = "^1.47"
pydantic = "^2.8"
"python-telegram-bot" = "^21.5"
beautifulsoup4 = "^4.12"
tenacity = "^9.0"
praw = "^7.7"
google-genai = "^1.0"
openai = "^1.50"
atproto = "^0.0.55"
supabase = "^2.9"
pillow = "^11.0"
edge-tts = "^6.1"
faster-whisper = "^1.0"
ffmpeg-python = "^0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
