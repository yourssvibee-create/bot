name: bot2-nightly

on:
  schedule:
    - cron: "0 15 * * *"     # 07:00 America/Los_Angeles daily (15:00 UTC = 07:00 PST / 08:00 PDT; PST window)
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "bot2-social-factory/**"
      - "shared/**"
      - ".github/workflows/bot2-nightly.yml"

concurrency:
  group: bot2-nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bot2-social-factory
    env:
      BOT_ID:                    bot2
      GROQ_API_KEY:              ${{ secrets.BOT2_GROQ_API_KEY }}
      GEMINI_API_KEY:            ${{ secrets.BOT2_GEMINI_API_KEY }}
      NVIDIA_API_KEY:            ${{ secrets.BOT2_NVIDIA_API_KEY }}
      OPENROUTER_API_KEY:        ${{ secrets.BOT2_OPENROUTER_API_KEY }}
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      REDDIT_CLIENT_ID:          ${{ secrets.BOT2_REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET:      ${{ secrets.BOT2_REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME:           ${{ secrets.BOT2_REDDIT_USERNAME }}
      REDDIT_PASSWORD:           ${{ secrets.BOT2_REDDIT_PASSWORD }}
      BLUESKY_HANDLE:            ${{ secrets.BOT2_BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD:      ${{ secrets.BOT2_BLUESKY_APP_PASSWORD }}
      PRODUCTHUNT_API_TOKEN:     ${{ secrets.BOT2_PRODUCTHUNT_API_TOKEN }}
      # X (Twitter) v2 — OAuth 1.0a user context (4 keys required)
      X_API_KEY:                 ${{ secrets.BOT2_X_API_KEY }}
      X_API_SECRET:              ${{ secrets.BOT2_X_API_SECRET }}
      X_ACCESS_TOKEN:            ${{ secrets.BOT2_X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET:     ${{ secrets.BOT2_X_ACCESS_TOKEN_SECRET }}
      # YouTube Data API v3 — OAuth 2.0 refresh-token flow
      YT_CLIENT_ID:              ${{ secrets.BOT2_YT_CLIENT_ID }}
      YT_CLIENT_SECRET:          ${{ secrets.BOT2_YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN:          ${{ secrets.BOT2_YT_REFRESH_TOKEN }}
      # Pinterest API v5 — long-lived OAuth2 access token + default board
      PINTEREST_ACCESS_TOKEN:    ${{ secrets.BOT2_PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID:        ${{ secrets.BOT2_PINTEREST_BOARD_ID }}
      HUGGINGFACE_API_TOKEN:     ${{ secrets.BOT2_HUGGINGFACE_API_TOKEN }}
      PIXABAY_API_KEY:           ${{ secrets.BOT2_PIXABAY_API_KEY }}
      LLM_PROVIDER_ORDER:        "groq,gemini,nvidia,openrouter"
      # Flip to "false" after the first clean end-to-end CI run verifies
      # the fail-soft orchestrator + all phase wiring.
      BOT2_DRY_RUN:              "true"
      LOG_LEVEL:                 INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install poetry
        run: pipx install poetry==2.5.1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate lock if missing
        run: |
          if [ ! -f poetry.lock ]; then
            echo "poetry.lock absent; generating on runner (Python 3.11)"
            poetry lock --no-interaction --no-ansi
          fi

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Install playwright chromium
        run: poetry run playwright install --with-deps chromium

      - name: Run nightly orchestrator (live)
        run: poetry run python -m workers.nightly_run
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bot2-social-factory

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot2-shots
          path: ~/.bot_sessions/bot2/shots
          if-no-files-found: ignore
          retention-days: 7
