name: bot2-nightly

on:
  schedule:
    - cron: "0 15 * * *"     # 07:00 America/Los_Angeles daily (15:00 UTC = 07:00 PST / 08:00 PDT; PST window)
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "bot2-social-factory/**"
      - "shared/**"
      - ".github/workflows/bot2-nightly.yml"

concurrency:
  group: bot2-nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bot2-social-factory
    env:
      BOT_ID:                    bot2
      GROQ_API_KEY:              ${{ secrets.BOT2_GROQ_API_KEY }}
      GEMINI_API_KEY:            ${{ secrets.BOT2_GEMINI_API_KEY }}
      NVIDIA_API_KEY:            ${{ secrets.BOT2_NVIDIA_API_KEY }}
      OPENROUTER_API_KEY:        ${{ secrets.BOT2_OPENROUTER_API_KEY }}
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      REDDIT_CLIENT_ID:          ${{ secrets.BOT2_REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET:      ${{ secrets.BOT2_REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME:           ${{ secrets.BOT2_REDDIT_USERNAME }}
      REDDIT_PASSWORD:           ${{ secrets.BOT2_REDDIT_PASSWORD }}
      BLUESKY_HANDLE:            ${{ secrets.BOT2_BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD:      ${{ secrets.BOT2_BLUESKY_APP_PASSWORD }}
      BOT2_DRY_RUN:              "false"
      LOG_LEVEL:                 INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install poetry
        run: pipx install poetry==1.8.3

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Install playwright chromium
        run: poetry run playwright install --with-deps chromium

      - name: Run nightly orchestrator (live)
        run: poetry run python -m workers.nightly_run
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bot2-social-factory

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot2-shots
          path: ~/.bot_sessions/bot2/shots
          if-no-files-found: ignore
          retention-days: 7
