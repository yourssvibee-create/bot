name: bot1-nightly

on:
  schedule:
    - cron: "0 2 * * *"      # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: bot1-nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bot1-intent-hijacker
    env:
      GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
      HUNTER_API_KEY:      ${{ secrets.HUNTER_API_KEY }}
      DATABASE_URL:        ${{ secrets.DATABASE_URL }}
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      # TODO: add REDDIT_* secrets once dave_fieldston clears karma gate.
      REDDIT_CLIENT_ID:     TODO_karma_gate
      REDDIT_CLIENT_SECRET: TODO_karma_gate
      NITTER_INSTANCES:    "https://nitter.net,https://nitter.privacydev.net,https://nitter.poast.org"
      BOT1_DRY_RUN:        "false"
      LOG_LEVEL:           INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install poetry
        run: pipx install poetry==2.5.1

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Install playwright chromium
        run: poetry run playwright install --with-deps chromium

      - name: Run nightly orchestrator
        run: poetry run python -m workers.nightly_run

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot1-shots
          path: ~/.bot_sessions/bot1/shots
          if-no-files-found: ignore
          retention-days: 7
